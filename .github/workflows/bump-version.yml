name: Bump Version

# Manually triggered from the Actions tab (Run workflow button).
# Type in the target branch (develop, main, or a release/x.y.z branch)
# and the new version number. It checks out that branch, sets the
# version in package.json, and opens a PR back into that branch —
# no local edits needed.

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to bump (e.g. develop, main, release/1.2.0)"
        required: true
        type: string
        default: develop
      version:
        description: "New version number (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${{ inputs.version }}' isn't a valid semver version (expected e.g. 0.2.0 or 1.0.0-beta.1)"
            exit 1
          fi

      - name: Verify target branch exists
        run: |
          if ! git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" "${{ inputs.target_branch }}" > /dev/null; then
            echo "::error::Branch '${{ inputs.target_branch }}' doesn't exist on this repo. Check spelling (e.g. release/1.2.0, not Release/1.2.0)."
            exit 1
          fi

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Sets package.json + package-lock.json to the exact version typed in,
      # rather than incrementing patch/minor/major.
      - name: Set version
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version

      - name: Open version bump PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/bump-version-${{ inputs.version }}
          base: ${{ inputs.target_branch }}
          title: "chore: bump version to ${{ inputs.version }}"
          commit-message: "chore: bump version to ${{ inputs.version }}"
          body: |
            Manual version bump requested by @${{ github.actor }} via workflow_dispatch.

            Target branch: `${{ inputs.target_branch }}`
            New version: `${{ inputs.version }}`
          labels: version-bump